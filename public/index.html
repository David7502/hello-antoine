<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a0533" />
    <title>Hello Antoine</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23ff2d95'/%3E%3Cstop offset='.5' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2306e7c5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #fff8ff;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: ui-rounded, "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
        background: #14001f;
      }

      .stage {
        position: fixed;
        inset: -10%;
        background:
          radial-gradient(circle at 12% 18%, #ff2d95 0%, transparent 36%),
          radial-gradient(circle at 88% 12%, #7c3aed 0%, transparent 40%),
          radial-gradient(circle at 78% 82%, #06d6c5 0%, transparent 38%),
          radial-gradient(circle at 18% 86%, #ffb703 0%, transparent 34%),
          radial-gradient(circle at 50% 48%, #3a0ca3 0%, transparent 52%),
          linear-gradient(145deg, #2b0050, #120024 42%, #001b2e);
        background-size: 160% 160%;
        animation: drift 14s ease-in-out infinite alternate;
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          rgba(255, 45, 149, 0.25),
          rgba(124, 58, 237, 0.05) 30%,
          rgba(6, 214, 197, 0.22) 55%,
          rgba(255, 183, 3, 0.2)
        );
        background-size: 240% 240%;
        mix-blend-mode: screen;
        animation: shimmer 10s linear infinite;
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
        opacity: 0.85;
        animation: float 7s ease-in-out infinite;
      }

      .orb:nth-child(1) {
        width: 18vmin;
        height: 18vmin;
        left: 8%;
        top: 16%;
        background: #ff4d6d;
        animation-delay: -1s;
      }

      .orb:nth-child(2) {
        width: 12vmin;
        height: 12vmin;
        right: 12%;
        top: 22%;
        background: #4cc9f0;
        animation-delay: -3s;
      }

      .orb:nth-child(3) {
        width: 16vmin;
        height: 16vmin;
        right: 18%;
        bottom: 12%;
        background: #b5179e;
        animation-delay: -2s;
      }

      .orb:nth-child(4) {
        width: 10vmin;
        height: 10vmin;
        left: 18%;
        bottom: 16%;
        background: #fee440;
        animation-delay: -4.5s;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(1100px, calc(100% - 2rem));
        padding: clamp(1.5rem, 4vw, 3rem) clamp(1rem, 3vw, 2rem);
        text-align: center;
      }

      .kicker {
        margin: 0 0 0.6rem;
        font-size: clamp(0.85rem, 2vw, 1.05rem);
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #fff4c8;
        text-shadow: 0 0 16px rgba(255, 214, 80, 0.65);
      }

      h1 {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        column-gap: 0.28em;
        row-gap: 0.08em;
        font-size: clamp(3.1rem, 13vw, 8.4rem);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      .word {
        display: inline-flex;
        padding: 0.12em 0;
      }

      .letter {
        --hue: calc(var(--i) * 28);
        display: inline-block;
        padding: 0 0.015em;
        color: hsl(var(--hue) 100% 68%);
        text-shadow:
          0 0.08em 0 rgba(20, 0, 30, 0.28),
          0 0 0.35em hsl(var(--hue) 100% 62% / 0.85);
        transform-origin: 50% 80%;
        animation: wave 2.2s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.09s);
        cursor: default;
        transition: filter 0.2s ease;
      }

      .letter:hover {
        animation: none;
        transform: translateY(-0.28em) scale(1.22) rotate(-8deg);
        filter: brightness(1.15);
      }

      .hint {
        margin: 1.1rem 0 0;
        font-size: clamp(0.95rem, 2.4vw, 1.15rem);
        color: rgba(255, 248, 255, 0.88);
      }

      @keyframes drift {
        from {
          background-position: 0% 20%, 100% 0%, 80% 100%, 0% 100%, 50% 50%, 0 0;
        }
        to {
          background-position: 20% 0%, 70% 30%, 40% 70%, 30% 60%, 50% 40%, 0 0;
        }
      }

      @keyframes shimmer {
        from {
          background-position: 0% 50%;
        }
        to {
          background-position: 100% 50%;
        }
      }

      @keyframes wave {
        0%,
        55%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        25% {
          transform: translateY(-0.22em) rotate(-7deg);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-2.4vmin) scale(1.08);
        }
      }

      @media (max-width: 420px) {
        .kicker {
          letter-spacing: 0.16em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .stage,
        .stage::after,
        .orb,
        .letter {
          animation: none;
        }

        .letter:hover {
          transform: scale(1.08);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" aria-hidden="true">
      <span class="orb"></span>
      <span class="orb"></span>
      <span class="orb"></span>
      <span class="orb"></span>
    </div>
    <main>
      <p class="kicker">say it loud</p>
      <h1 aria-label="Hello Antoine">
        <span class="word" aria-hidden="true">
          <span class="letter" style="--i: 0">H</span>
          <span class="letter" style="--i: 1">e</span>
          <span class="letter" style="--i: 2">l</span>
          <span class="letter" style="--i: 3">l</span>
          <span class="letter" style="--i: 4">o</span>
        </span>
        <span class="word" aria-hidden="true">
          <span class="letter" style="--i: 5">A</span>
          <span class="letter" style="--i: 6">n</span>
          <span class="letter" style="--i: 7">t</span>
          <span class="letter" style="--i: 8">o</span>
          <span class="letter" style="--i: 9">i</span>
          <span class="letter" style="--i: 10">n</span>
          <span class="letter" style="--i: 11">e</span>
        </span>
      </h1>
      <p class="hint">Hover a letter and it jumps.</p>
    </main>
  </body>
</html>
